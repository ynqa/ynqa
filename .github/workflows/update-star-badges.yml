name: Update profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * 0" # Monday at 00:30 JST

permissions:
  contents: write

env:
  STAR_BADGE_REPOS: jnv sig logu empiriqa kuqu lanterm promkit j9 kubernetes-rust wego pandavro

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download star badges
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          for repo in $STAR_BADGE_REPOS; do
            curl -fsSL "https://badgen.net/github/stars/ynqa/${repo}?color=e0b43c&labelColor=black&icon=github&cacheControl=3600" \
              -o "$tmpdir/${repo}-stars.svg"
            grep -q 'aria-label="stars:' "$tmpdir/${repo}-stars.svg"
          done
          mkdir -p assets/badges
          cp "$tmpdir"/*-stars.svg assets/badges/
      - name: Download GitHub stats
        run: |
          set -eu
          stats_file="$(mktemp)"
          trap 'rm -f "$stats_file"' EXIT
          curl -fsSL --retry 3 --max-time 60 \
            "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=ynqa&theme=darcula" \
            -o "$stats_file"
          grep -q '<svg ' "$stats_file"
          grep -q '>Total Commits:</text>' "$stats_file"
          cp "$stats_file" assets/github-stats.svg
      - name: Commit profile asset updates
        run: |
          git add assets/badges assets/github-stats.svg
          if git diff --cached --quiet -- assets/badges assets/github-stats.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile assets"
          git push
